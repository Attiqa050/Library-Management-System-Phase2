<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Members | Library Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            📚 LibraryMS
        </div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="add-book.html">Add Book</a></li>
            <li><a href="members.html" class="active">Members</a></li>
            <li><a href="issue-book.html">Issue Book</a></li>
            <li><a href="issued-books.html">Issued Books</a></li>
        </ul>

    </nav>


    <!-- ================= Add Member Form ================= -->

    <section class="form-container">

        <div id="message"></div>

        <h1>Add New Member</h1>

        <form id="memberForm">

            <div class="input-group">
                <label for="name">Member Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter Member Name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="rollNo">Roll Number</label>
                <input
                    type="text"
                    id="rollNo"
                    placeholder="Enter Roll Number"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email Address"
                    required
                >
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter Phone Number"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Add Member
            </button>

        </form>


        <hr>


        <!-- ================= Members List ================= -->

        <h2>Members List</h2>

        <table class="books-table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="memberTableBody">

            </tbody>

        </table>

    </section>


    <!-- ================= JavaScript ================= -->

    <script src="../js/api.js"></script>
    <script src="../js/members.js"></script>

</body>

</html>
