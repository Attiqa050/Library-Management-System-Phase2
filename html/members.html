        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">

            <!-- ================= TOP BAR ================= -->

            <header class="topbar">

                <div>
                    <h1>Members</h1>
                    <p>Add and manage registered library members</p>
                </div>

                <div class="admin-badge">

                    <div class="admin-icon">
                        A
                    </div>

                    <div>
                        <strong>Librarian</strong>
                        <span>Administrator</span>
                    </div>

                </div>

            </header>


            <!-- ================= MEMBER SECTION ================= -->

            <section class="form-container">

                <div id="message"></div>

                <h1>Add New Member</h1>

                <form id="memberForm">

                    <div class="input-group">

                        <label for="name">
                            Member Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter Member Name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="rollNo">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="rollNo"
                            placeholder="Enter Roll Number"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter Email Address"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter Phone Number"
                            required
                        >

                    </div>


                    <button type="submit" class="btn">
                        Add Member
                    </button>

                </form>


                <hr>


                <!-- ================= MEMBERS LIST ================= -->

                <h2>Members List</h2>

                <div class="table-responsive">

                    <table class="books-table">

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Roll No</th>
                                <th>Email</th>
                                <th>Phone</th>
                            </tr>

                        </thead>

                        <tbody id="memberTableBody">

                        </tbody>

                    </table>

                </div>

            </section>
