<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books | Library Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            📚 LibraryMS
        </div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="books.html" class="active">Books</a></li>
            <li><a href="add-book.html">Add Book</a></li>
            <li><a href="members.html">Members</a></li>
            <li><a href="issue-book.html">Issue Book</a></li>
            <li><a href="issued-books.html">Issued Books</a></li>
        </ul>

    </nav>

    <!-- Books Section -->
    <section class="form-container">

        <h1>Books List</h1>

        <!-- Search Box -->
        <div class="input-group">

            <label for="search">Search Book</label>

            <input
                type="text"
                id="search"
                placeholder="Search by Title or Author"
            >

        </div>

        <!-- Books Table -->
        <table class="books-table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Total Copies</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="bookTableBody">

            </tbody>

        </table>

    </section>

    <!-- JavaScript -->
    <script src="../js/api.js"></script>
    <script src="../js/books.js"></script>

</body>

</html>
