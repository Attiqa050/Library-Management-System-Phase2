<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Member | Library Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">

                <span class="logo-icon">📚</span>

                <div>
                    <h2>LibraryMS</h2>
                    <p>Management System</p>
                </div>

            </div>

            <div class="menu-title">
                MAIN MENU
            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="home.html">
                        <span>🏠</span>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="books.html">
                        <span>📚</span>
                        Books
                    </a>
                </li>

                <li>
                    <a href="add-book.html">
                        <span>➕</span>
                        Add Book
                    </a>
                </li>

                <li>
                    <a href="members.html" class="active">
                        <span>👥</span>
                        Members
                    </a>
                </li>

                <li>
                    <a href="issue-book.html">
                        <span>📖</span>
                        Issue Book
                    </a>
                </li>

                <li>
                    <a href="issued-books.html">
                        <span>📋</span>
                        Issued Books
                    </a>
                </li>

            </ul>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOP BAR -->
            <header class="topbar">

                <div>
                    <h1>Edit Member</h1>
                    <p>Update the selected member information</p>
                </div>

                <div class="admin-badge">

                    <div class="admin-icon">
                        A
                    </div>

                    <div>
                        <strong>Librarian</strong>
                        <span>Administrator</span>
                    </div>

                </div>

            </header>


            <!-- EDIT MEMBER FORM -->
            <section class="form-container">

                <h1>Edit Member</h1>

                <form id="editMemberForm">

                    <div class="input-group">

                        <label for="name">
                            Member Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="rollNo">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="rollNo"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            required
                        >

                    </div>


                    <button type="submit" class="btn">
                        Save Changes
                    </button>

                </form>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script src="../js/api.js"></script>
    <script src="../js/edit-member.js"></script>

</body>

</html>
