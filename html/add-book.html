<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book | Library Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            📚 LibraryMS
        </div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="add-book.html" class="active">Add Book</a></li>
            <li><a href="members.html">Members</a></li>
            <li><a href="issue-book.html">Issue Book</a></li>
            <li><a href="issued-books.html">Issued Books</a></li>
        </ul>

    </nav>

    <section class="form-container">

        <div id="message"></div>

        <h1>Add New Book</h1>

        <form id="bookForm">

            <div class="input-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" placeholder="Enter Book Title" required>
            </div>

            <div class="input-group">
                <label for="author">Author Name</label>
                <input type="text" id="author" placeholder="Enter Author Name" required>
            </div>

            <div class="input-group">
                <label for="category">Category</label>
                <input type="text" id="category" placeholder="Enter Category" required>
            </div>

            <div class="input-group">
                <label for="copies">Total Copies</label>
                <input type="number" id="copies" placeholder="Enter Total Copies" min="1" required>
            </div>

            <button type="submit" class="btn">
                Add Book
            </button>

        </form>

    </section>


    <!-- ================= JavaScript ================= -->

    <script src="../js/api.js"></script>
    <script src="../js/books.js"></script>

</body>

</html>
