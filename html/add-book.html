        <main class="main-content">

            <!-- Top Bar -->

            <header class="topbar">

                <div>
                    <h1>Add Book</h1>
                    <p>Add a new book to the library collection</p>
                </div>

                <div class="admin-badge">

                    <div class="admin-icon">
                        A
                    </div>

                    <div>
                        <strong>Librarian</strong>
                        <span>Administrator</span>
                    </div>

                </div>

            </header>


            <!-- ================= ADD BOOK FORM ================= -->

            <section class="form-container">

                <div id="message"></div>

                <h1>Add New Book</h1>

                <form id="bookForm">

                    <div class="input-group">

                        <label for="title">
                            Book Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter Book Title"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="author">
                            Author Name
                        </label>

                        <input
                            type="text"
                            id="author"
                            placeholder="Enter Author Name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            placeholder="Enter Category"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="copies">
                            Total Copies
                        </label>

                        <input
                            type="number"
                            id="copies"
                            placeholder="Enter Total Copies"
                            min="1"
                            required
                        >

                    </div>


                    <button type="submit" class="btn">
                        Add Book
                    </button>

                </form>

            </section>

        </main>
