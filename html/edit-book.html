<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Book | Library Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <span class="logo-icon">📚</span>

                <div>
                    <h2>LibraryMS</h2>
                    <p>Management System</p>
                </div>

            </div>

            <div class="menu-title">
                MAIN MENU
            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="home.html">
                        <span>🏠</span>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="books.html" class="active">
                        <span>📚</span>
                        Books
                    </a>
                </li>

                <li>
                    <a href="add-book.html">
                        <span>➕</span>
                        Add Book
                    </a>
                </li>

                <li>
                    <a href="members.html">
                        <span>👥</span>
                        Members
                    </a>
                </li>

                <li>
                    <a href="issue-book.html">
                        <span>📖</span>
                        Issue Book
                    </a>
                </li>

                <li>
                    <a href="issued-books.html">
                        <span>📋</span>
                        Issued Books
                    </a>
                </li>

            </ul>

        </aside>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">

            <!-- ================= TOP BAR ================= -->

            <header class="topbar">

                <div>
                    <h1>Edit Book</h1>
                    <p>Update the selected book information</p>
                </div>

                <div class="admin-badge">

                    <div class="admin-icon">
                        A
                    </div>

                    <div>
                        <strong>Librarian</strong>
                        <span>Administrator</span>
                    </div>

                </div>

            </header>


            <!-- ================= EDIT BOOK FORM ================= -->

            <section class="form-container">

                <h1>Edit Book</h1>

                <form id="editBookForm">

                    <div class="input-group">

                        <label for="title">
                            Book Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="author">
                            Author Name
                        </label>

                        <input
                            type="text"
                            id="author"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="copies">
                            Total Copies
                        </label>

                        <input
                            type="number"
                            id="copies"
                            min="1"
                            required
                        >

                    </div>


                    <button type="submit" class="btn">
                        Save Changes
                    </button>

                </form>

            </section>

        </main>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/api.js"></script>
    <script src="../js/edit-book.js"></script>

</body>

</html>
